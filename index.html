<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1526">
<title>Marina's Perfect Little Day</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💚</text></svg>">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; overflow:hidden; background:#1b1526;
    touch-action:none; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
    font-family: "Courier New", monospace;
  }
  #wrap {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#1b1526;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display:block;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
  // dev cache-buster: always load the freshest game.js and assets
  window.DEV_CACHE_BUST = Date.now();
  const s = document.createElement('script');
  s.src = 'game.js?v=' + window.DEV_CACHE_BUST;
  document.body.appendChild(s);
</script>
</body>
</html>
